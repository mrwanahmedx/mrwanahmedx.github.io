name: Native n8n integration verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/n8n-native-e2e.yml"
      - "python-service/n8n-job-intake/**"

permissions:
  contents: read

concurrency:
  group: n8n-native-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-integration:
    name: Run actual n8n webhook and SQLite end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: python-service/n8n-job-intake
    steps:
      - name: Check out public portfolio
        uses: actions/checkout@v4

      - name: Offline workflow tests
        run: |
          set -euo pipefail
          node validate_workflow.js
          node verify_50_synthetic.js

      - name: Launch local demonstration API
        run: |
          set -euo pipefail
          mkdir -p state evidence
          python3 demo_api.py > "$RUNNER_TEMP/n8n-demo-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/n8n-demo-api.pid"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8767/health >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/n8n-demo-api.log"
          exit 1

      - name: Pull pinned n8n Docker image
        run: |
          set -euo pipefail
          docker pull docker.n8n.io/n8nio/n8n:2.42.6
          docker volume create portfolio-n8n-native-e2e

      - name: Import actual workflow into isolated n8n
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v portfolio-n8n-native-e2e:/home/node/.n8n \
            -v "$PWD:/portfolio:ro" \
            -e N8N_USER_FOLDER=/home/node/.n8n \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            docker.n8n.io/n8nio/n8n:2.42.6 \
            import:workflow --input=/portfolio/workflow_n8n.json

      - name: Publish imported workflow (before server startup)
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v portfolio-n8n-native-e2e:/home/node/.n8n \
            -e N8N_USER_FOLDER=/home/node/.n8n \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            docker.n8n.io/n8nio/n8n:2.42.6 \
            publish:workflow --id=portWAHAjobdemo1

      - name: Start isolated n8n instance
        run: |
          set -euo pipefail
          docker run -d --name portfolio-n8n-native-e2e --network host \
            -v portfolio-n8n-native-e2e:/home/node/.n8n \
            -e N8N_USER_FOLDER=/home/node/.n8n \
            -e N8N_HOST=127.0.0.1 \
            -e N8N_LISTEN_ADDRESS=127.0.0.1 \
            -e N8N_PORT=5679 \
            -e N8N_RUNNERS_BROKER_PORT=5680 \
            -e WEBHOOK_URL=http://127.0.0.1:5679/ \
            -e N8N_SECURE_COOKIE=false \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_PERSONALIZATION_ENABLED=false \
            -e N8N_LOG_LEVEL=info \
            docker.n8n.io/n8nio/n8n:2.42.6
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:5679/healthz >/dev/null; then
              echo "NATIVE_N8N_RUNNING"
              sleep 5
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' portfolio-n8n-native-e2e)" != "true" ]; then
              docker logs portfolio-n8n-native-e2e
              exit 1
            fi
            sleep 1
          done
          docker logs portfolio-n8n-native-e2e
          exit 1

      - name: Test seven real n8n webhook executions
        run: |
          set -euo pipefail
          python3 test_workflow.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/integration_test_results.json")
          assert p.exists(), "Native test evidence file missing"
          result=json.loads(p.read_text())
          assert result["test_count"] == 7
          assert result["passed_count"] == 7
          assert all(case["passed"] for case in result["tests"])
          print("NATIVE_E2E_7_OF_7_VERIFIED")
          PY

      - name: Report failure diagnostics
        if: failure()
        run: |
          echo "::group::n8n Docker logs"
          docker logs --tail 200 portfolio-n8n-native-e2e || true
          echo "::endgroup::"
          echo "::group::Demo API logs"
          tail -n 100 "$RUNNER_TEMP/n8n-demo-api.log" || true
          echo "::endgroup::"

      - name: Clean up local containers and volume
        if: always()
        run: |
          docker rm -f portfolio-n8n-native-e2e >/dev/null 2>&1 || true
          docker volume rm portfolio-n8n-native-e2e >/dev/null 2>&1 || true
